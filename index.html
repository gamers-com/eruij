<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 🌐</title>

    <!-- Open Graph / Facebook Link Preview Tags -->
    <meta property="og:title" content="Google Search 🌐" />
    <meta property="og:description" content="Search the world's information, including webpages, images, videos and more. 🔍" />
    <meta property="og:image" content="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" />
    <meta property="og:type" content="website" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #202124;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 20px;
            gap: 15px;
        }

        .navbar a {
            color: #202124;
            text-decoration: none;
            font-size: 14px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .btn-signin {
            background-color: #1a73e8;
            color: #ffffff !important;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .btn-signin:hover {
            background-color: #1557b0;
            text-decoration: none !important;
        }

        /* Main Body Content */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px;
        }

        .logo-img {
            width: 272px;
            height: 92px;
            margin-bottom: 20px;
        }

        /* Footer Styling */
        .footer {
            background-color: #f2f2f2;
            border-top: 1px solid #e4e4e4;
            padding: 15px 20px;
            text-align: center;
            font-size: 13px;
            color: #70757a;
        }

        .footer-links {
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .footer-links a, .copyright a {
            color: #70757a;
            text-decoration: none;
        }

        .footer-links a:hover, .copyright a:hover {
            text-decoration: underline;
        }

        .copyright {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header class="navbar">
        <a href="https://mail.google.com/mail/&ogbl" aria-label="Gmail">Gmail 📧</a>
        <a href="https://www.google.com/imghp?hl=en&ogbl" aria-label="Images">Images 🖼️</a>
        <a href="https://accounts.google.com/ServiceLogin?hl=en&passive=true&continue=https://www.google.com/" class="btn-signin">Sign in 🔑</a>
    </header>

    <!-- Center Logo / Main Content -->
    <main class="main-container">
        <img class="logo-img" src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google Logo 🔍">
    </main>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="footer-links">
            <a href="https://www.google.com/intl/en/ads/">Advertising 📢</a>
            <a href="https://www.google.com/services/">Business Solutions 💼</a>
            <a href="https://www.google.com/intl/en/about.html">About Google ℹ️</a>
        </div>
        <div class="copyright">
            © 2026 - <a href="https://www.google.com/intl/en/policies/privacy/">Privacy 🔒</a> - <a href="https://www.google.com/intl/en/policies/terms/">Terms 📄</a>
        </div>
    </footer>

</body>
</html>
